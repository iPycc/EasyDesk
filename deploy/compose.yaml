name: easydesk

services:
  signal:
    build:
      context: ../backend
    image: easydesk-signal:${EASYDESK_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      EASYDESK_BIND_ADDRESS: 0.0.0.0
      EASYDESK_PORT: 8080
      EASYDESK_WORKER_THREADS: ${EASYDESK_WORKER_THREADS:-4}
      EASYDESK_DATABASE_PATH: /var/lib/easydesk/easydesk.sqlite3
    volumes:
      - signal-data:/var/lib/easydesk
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      signal:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      EASYDESK_DOMAIN: ${EASYDESK_DOMAIN}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

  coturn:
    image: coturn/coturn:4.18.0-r0-debian
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      TURN_REALM: ${TURN_REALM}
    entrypoint: ["/bin/sh", "/opt/easydesk/coturn-entrypoint.sh"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.base.conf:ro
      - ./coturn/entrypoint.sh:/opt/easydesk/coturn-entrypoint.sh:ro
    secrets:
      - turn_shared_secret
    read_only: true
    tmpfs:
      - /run/coturn:mode=0700
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true

secrets:
  turn_shared_secret:
    file: ./secrets/turn_shared_secret

volumes:
  signal-data:
  caddy-data:
  caddy-config:
